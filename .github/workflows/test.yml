name: Run utPLSQL Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-xe
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: oracle
        options: >-
          --health-cmd "echo 'select 1 from dual;' | sqlplus -s system/oracle@//localhost/XEPDB1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SQLcl
        run: |
          curl -L -o sqlcl.zip https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-25.2.1.195.1751.zip
          unzip sqlcl.zip -d sqlcl

      - name: Download and install utPLSQL
        run: |
          git clone https://github.com/utPLSQL/utPLSQL.git
          ./sqlcl/sqlcl/bin/sql -S sys/oracle@//localhost/XEPDB1 as sysdba @utPLSQL/source/install_headless.sql
          ./sqlcl/sqlcl/bin/sql -S sys/oracle@//localhost/XEPDB1 as sysdba @ut3_grants.sql

      - name: Run Tests
        run: |
          ./sqlcl/sqlcl/bin/sql -S sys/oracle@//localhost/XEPDB1 as sysdba @install_calculator.sql
          ./sqlcl/sqlcl/bin/sql -S sys/oracle@//localhost/XEPDB1 as sysdba @install_tests.sql
          ./sqlcl/sqlcl/bin/sql -S sys/oracle@//localhost/XEPDB1 as sysdba @run_tests.sql

      - name: Upload JUnit test results
        uses: actions/upload-artifact@v3
        with:
          name: utplsql-test-results
          path: ut_results.xml

      - name: Publish test summary to GitHub UI
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: ut_results.xml
          check_name: 'PL/SQL Unit Tests'

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v3
        with:
          name: utplsql-coverage-report
          path: coverage.html
